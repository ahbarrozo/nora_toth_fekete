services:
  # SvelteKit application
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - app-network

  # Hono with Bun application
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: back
    ports:
      - "3000:3000" 
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
